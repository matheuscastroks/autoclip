<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>AutoClip — Iniciando</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
        color: #edf1f4;
        background: #101316;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #101316;
      }
      main {
        width: min(100% - 48px, 440px);
        padding: 28px;
        border: 1px solid #34434e;
        border-radius: 8px;
        background: #171d22;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }
      .mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 7px;
        color: #16232d;
        background: #afc6d5;
        font-size: 20px;
        font-weight: 700;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: #a5b5be;
        font-size: 13px;
        line-height: 1.5;
      }
      .progress {
        height: 3px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 3px;
        background: #283540;
      }
      .progress::after {
        display: block;
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: #afc6d5;
        content: '';
        animation: loading 1.4s ease-in-out infinite alternate;
      }
      @keyframes loading {
        to {
          transform: translateX(185%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <div class="brand">
        <span class="mark" aria-hidden="true">A</span>
        <h1 id="title">AutoClip</h1>
      </div>
      <p id="status" role="status" aria-live="polite">Iniciando o motor local…</p>
      <div class="progress" aria-hidden="true"></div>
    </main>
  </body>
</html>
