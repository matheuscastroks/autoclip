[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclip-editor-engine"
version = "0.1.0"
description = "CPU-first OpenShorts media engine with configurable Gemini analysis"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3", "faster-whisper==1.2.1", "av==18.1.0", "google-genai>=1,<3", "keyring>=25,<26", "yt-dlp>=2026.8", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "Pillow>=10", "httpx>=0.28,<1"]
desktop = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psutil>=6,<8"]

[project.scripts]
autoclip-engine = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*", "vendor*"]

[tool.setuptools.package-data]
engine = ["prompts/*.txt", "contracts/schemas/*.json"]
"vendor.openshorts" = ["LICENSE", "UPSTREAM.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_media: opt-in real corpus test"]
